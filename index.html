<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نيّر — NAIR · وكيلك المالي الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ نيّر — design tokens: light against the desert night ============ */
:root{
  --bg:#0B1024; --bg2:#0F1734; --bg3:#15204A;
  --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07);
  --line:rgba(255,206,130,.14); --line2:rgba(255,255,255,.08);
  --text:#F3F5FC; --muted:#96A2C6; --faint:#5E6B92;
  --light1:#FFD27A; --light2:#F59E2D; --light3:#C97B12;
  --safe:#43D9AE; --safe-dim:rgba(67,217,174,.14);
  --risk:#F2545B; --risk-dim:rgba(242,84,91,.13);
  --warn:#FFA245; --warn-dim:rgba(255,162,69,.13);
  --alinma:#C9A24B;
  --r:18px; --r-sm:13px;
  --disp:'Alexandria',sans-serif; --body:'IBM Plex Sans Arabic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--body);background:#06091A;color:var(--text);
  display:flex;align-items:center;justify-content:center;min-height:100dvh;
  background-image:radial-gradient(900px 500px at 80% -10%,rgba(245,158,45,.10),transparent 60%),
                   radial-gradient(700px 500px at 10% 110%,rgba(67,217,174,.06),transparent 60%);
}
#phone{
  position:relative;width:min(430px,100vw);height:min(932px,100dvh);
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 70%,#0C1330 100%);
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);
}
@media(min-width:480px){#phone{border-radius:34px;height:min(900px,94dvh)}}
/* ambient light field */
#phone::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(420px 260px at 50% -8%,rgba(255,210,122,.13),transparent 65%);}
/* ============ app bar ============ */
#appbar{position:relative;z-index:5;display:flex;align-items:center;gap:10px;padding:14px 18px 10px;}
#appbar .orb-mini{width:34px;height:34px;flex:none}
#appbar h1{font:600 16px/1 var(--disp);letter-spacing:.2px}
#appbar .sub{font-size:11px;color:var(--muted);margin-top:3px}
#appbar .spacer{flex:1}
.score-chip{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);
  border-radius:99px;padding:6px 11px;font:600 12px var(--disp);cursor:pointer}
.score-chip .dot{width:7px;height:7px;border-radius:50%}
.sandbox-tag{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:9;
  font-size:9px;letter-spacing:1px;color:#0B1024;background:linear-gradient(90deg,var(--light1),var(--light2));
  padding:2px 12px;border-radius:0 0 8px 8px;font-weight:700}
/* ============ screens ============ */
#screen-root{position:relative;z-index:2;flex:1;overflow-y:auto;overflow-x:hidden;padding:0 18px 110px;scrollbar-width:none}
#screen-root::-webkit-scrollbar{display:none}
.view{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2.vt{font:700 22px/1.3 var(--disp);margin:14px 0 4px}
p.vs{color:var(--muted);font-size:13px;line-height:1.8;margin-bottom:14px}
.section-t{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.section-t b{font:600 14px var(--disp)}
.section-t a{font-size:12px;color:var(--light1);cursor:pointer;text-decoration:none}
/* ============ cards ============ */
.card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:16px;margin-bottom:12px;position:relative}
.card.glow{border-color:var(--line);box-shadow:0 0 40px rgba(245,158,45,.07) inset}
.card.risk{border-color:rgba(242,84,91,.35);background:linear-gradient(180deg,var(--risk-dim),var(--card))}
.card.safe{border-color:rgba(67,217,174,.3);background:linear-gradient(180deg,var(--safe-dim),var(--card))}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line2)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)} .kv b{font-family:var(--disp)}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid}
.tag.r{color:var(--risk);border-color:rgba(242,84,91,.4);background:var(--risk-dim)}
.tag.w{color:var(--warn);border-color:rgba(255,162,69,.4);background:var(--warn-dim)}
.tag.s{color:var(--safe);border-color:rgba(67,217,174,.4);background:var(--safe-dim)}
.tag.g{color:var(--light1);border-color:var(--line);background:rgba(255,210,122,.08)}
.why{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--light1);cursor:pointer;border:none;background:none;font-family:var(--body)}
.why::before{content:'؟';display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--light3);font-size:10px}
/* ============ buttons ============ */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;cursor:pointer;
  font:600 14px var(--disp);border-radius:14px;padding:15px;transition:.18s;color:#241500;
  background:linear-gradient(135deg,var(--light1),var(--light2));box-shadow:0 6px 24px rgba(245,158,45,.25)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line2);box-shadow:none}
.btn.danger{background:var(--risk-dim);color:var(--risk);border:1px solid rgba(242,84,91,.4);box-shadow:none}
.btn.safe{background:linear-gradient(135deg,#52E6BC,#1FA982);color:#03241A}
.btn.sm{padding:10px 14px;font-size:12.5px;width:auto;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:10px;margin-top:12px}
.btnrow .btn{flex:1}
/* ============ the NAIR orb (signature) ============ */
.orb{position:relative;border-radius:50%;flex:none}
.orb .core{position:absolute;inset:18%;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#FFF3D6 0%,var(--light1) 32%,var(--light2) 62%,var(--light3) 100%);
  box-shadow:0 0 26px rgba(245,158,45,.55),0 0 70px rgba(245,158,45,.22);
  animation:breath 3.4s ease-in-out infinite}
.orb .ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,210,122,.35);animation:ringPulse 3.4s ease-in-out infinite}
.orb .ring.r2{inset:-14%;border-color:rgba(255,210,122,.14);animation-delay:.5s}
.orb .sweep{display:none;position:absolute;inset:-8%;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 78%,rgba(255,230,170,.85) 92%,transparent 100%);
  animation:spin 1.3s linear infinite;-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%)}
.orb[data-state="scanning"] .sweep{display:block}
.orb[data-state="scanning"] .core{animation-duration:1.2s}
.orb[data-state="alert"] .core{background:radial-gradient(circle at 38% 32%,#FFE2D6,#FF9A7A 35%,var(--risk) 70%,#8E1F2C);box-shadow:0 0 26px rgba(242,84,91,.6);animation-duration:1.1s}
.orb[data-state="alert"] .ring{border-color:rgba(242,84,91,.5);animation-duration:1.1s}
.orb[data-state="protect"] .core{background:radial-gradient(circle at 38% 32%,#DFFFF4,#7BEACB 35%,var(--safe) 70%,#0E7A5C);box-shadow:0 0 26px rgba(67,217,174,.55)}
.orb[data-state="protect"] .ring{border-color:rgba(67,217,174,.5)}
@keyframes breath{0%,100%{transform:scale(.94);filter:brightness(.95)}50%{transform:scale(1.04);filter:brightness(1.12)}}
@keyframes ringPulse{0%,100%{transform:scale(.96);opacity:.7}50%{transform:scale(1.06);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.orb .core,.orb .ring,.orb .sweep{animation:none!important}}
/* ============ tab bar ============ */
#tabbar{position:absolute;bottom:0;left:0;right:0;z-index:8;display:flex;align-items:flex-end;justify-content:space-around;
  padding:10px 8px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(11,16,36,0),rgba(8,12,28,.92) 30%,#080C1C);backdrop-filter:blur(14px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:var(--faint);cursor:pointer;border:none;background:none;font-family:var(--body);min-width:58px;padding:4px 0}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.tab.on{color:var(--light1)}
.tab.center{margin-top:-26px}
.tab.center .orb{width:52px;height:52px}
/* ============ lists ============ */
.litem{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.litem:last-child{border-bottom:0}
.licon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font:700 13px var(--disp);flex:none}
.litem .t{font-size:13.5px;font-weight:600}
.litem .d{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.6}
.litem .amt{text-align:left;font:600 13.5px var(--disp);white-space:nowrap}
.litem .amt small{display:block;font:400 10.5px var(--body);color:var(--muted);margin-top:3px}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--light1),var(--light2))}
.bar i.s{background:linear-gradient(90deg,#7BEACB,var(--safe))}
.bar i.r{background:linear-gradient(90deg,#FF8A92,var(--risk))}
/* ============ chat ============ */
.chatwrap{display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.msg{max-width:86%;padding:12px 15px;border-radius:16px;font-size:13.5px;line-height:1.9;animation:fadeUp .3s ease both}
.msg.user{align-self:flex-start;background:linear-gradient(135deg,rgba(255,210,122,.16),rgba(245,158,45,.10));border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.agent{align-self:flex-end;background:var(--card2);border:1px solid var(--line2);border-bottom-right-radius:5px}
.msg .mini-kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line2)}
.msg .mini-kv:last-child{border-bottom:0}
.msg .mini-kv span{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.chip{font-size:12px;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:rgba(255,210,122,.06);color:var(--light1);cursor:pointer;font-family:var(--body)}
#chatbar{display:flex;gap:8px;position:sticky;bottom:0;padding:10px 0 4px;background:linear-gradient(180deg,transparent,var(--bg2) 35%)}
#chatbar input{flex:1;background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:13px 15px;color:var(--text);font:400 13.5px var(--body);outline:none}
#chatbar input:focus{border-color:var(--line)}
#chatbar .send{width:48px;height:48px;flex:none;border-radius:14px;border:none;background:linear-gradient(135deg,var(--light1),var(--light2));font-size:18px;cursor:pointer;color:#241500}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--light1);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
/* ============ proposal card ============ */
.proposal{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:6px 0}
.proposal .ph{display:flex;align-items:center;gap:10px;padding:13px 15px;background:linear-gradient(90deg,rgba(255,210,122,.12),transparent)}
.proposal .ph b{font:600 13.5px var(--disp)}
.proposal .pb{padding:6px 15px 14px}
.proposal.done{opacity:.75}
.proposal .status{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px}
/* ============ toggles & sheets & toast ============ */
.tgl{position:relative;width:46px;height:26px;flex:none;cursor:pointer}
.tgl input{display:none}
.tgl i{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.12);transition:.2s}
.tgl i::after{content:'';position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tgl input:checked+i{background:linear-gradient(90deg,var(--light1),var(--light2))}
.tgl input:checked+i::after{transform:translateX(-20px)}
#sheet-root{position:absolute;inset:0;z-index:40;display:none;align-items:flex-end}
#sheet-root.open{display:flex}
#sheet-root .veil{position:absolute;inset:0;background:rgba(4,7,18,.66);backdrop-filter:blur(3px)}
.sheet{position:relative;width:100%;max-height:82%;overflow-y:auto;background:linear-gradient(180deg,#161F44,#0F1734);
  border-radius:26px 26px 0 0;border-top:1px solid var(--line);padding:14px 20px 30px;animation:sheetUp .3s ease both;scrollbar-width:none}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:42px;height:4px;border-radius:99px;background:rgba(255,255,255,.2);margin:0 auto 14px}
#toast{position:absolute;top:46px;left:50%;transform:translateX(-50%) translateY(-80px);z-index:60;
  background:#1A2450;border:1px solid var(--line);border-radius:13px;padding:11px 18px;font-size:12.5px;font-weight:600;
  box-shadow:0 14px 40px rgba(0,0,0,.5);transition:.35s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
#toast.show{transform:translateX(-50%) translateY(0)}
/* ============ scan ============ */
.scanlog{font-size:12px;color:var(--muted);line-height:2.2;min-height:170px}
.scanlog div{display:flex;gap:8px;align-items:baseline;animation:fadeUp .3s ease both}
.scanlog .ok{color:var(--safe)} .scanlog .hl{color:var(--light1)}
/* ============ score ring ============ */
.ringwrap{position:relative;width:168px;height:168px;margin:6px auto}
.ringwrap svg{transform:rotate(-90deg)}
.ringwrap .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .mid b{font:800 40px/1 var(--disp)}
.ringwrap .mid span{font-size:11px;color:var(--muted);margin-top:5px}
/* ============ demo mode ============ */
#demo-fab{position:absolute;bottom:106px;left:14px;z-index:30;display:flex;align-items:center;gap:7px;border:1px solid var(--line);
  background:rgba(20,28,62,.92);backdrop-filter:blur(8px);color:var(--light1);font:600 11.5px var(--body);padding:10px 14px;border-radius:99px;cursor:pointer;box-shadow:0 8px 26px rgba(0,0,0,.45)}
#demo-overlay{position:absolute;left:0;right:0;bottom:0;z-index:50;display:none;padding:14px;}
#demo-overlay.open{display:block}
#demo-overlay .panel{background:linear-gradient(135deg,#1B2658,#121A3E);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.6);animation:sheetUp .3s ease both}
#demo-overlay .steps{font-size:10.5px;color:var(--light1);font-weight:700;letter-spacing:.5px}
#demo-overlay h4{font:700 15px var(--disp);margin:7px 0 5px}
#demo-overlay p{font-size:12px;color:var(--muted);line-height:1.9}
.consent-scope{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line2)}
.consent-scope:last-child{border:0}
.consent-scope .ic{width:34px;height:34px;border-radius:11px;background:rgba(255,210,122,.1);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.alinma-mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#2A2210,#171205);border:1px solid rgba(201,162,75,.45);display:flex;align-items:center;justify-content:center;flex:none}
.tl{position:relative;padding-right:20px}
.tl::before{content:'';position:absolute;right:5px;top:8px;bottom:8px;width:1.5px;background:linear-gradient(180deg,var(--line),transparent)}
.tlitem{position:relative;padding:9px 14px 9px 0;font-size:12.5px}
.tlitem::before{content:'';position:absolute;right:-18px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--light2);box-shadow:0 0 10px rgba(245,158,45,.6)}
.tlitem.user::before{background:var(--safe);box-shadow:0 0 10px rgba(67,217,174,.6)}
.tlitem.risk::before{background:var(--risk);box-shadow:0 0 10px rgba(242,84,91,.6)}
.tlitem .tm{font-size:10px;color:var(--faint);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line2);border-radius:var(--r-sm);padding:13px}
.stat b{display:block;font:700 18px var(--disp);margin-top:4px}
.stat span{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:10.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-left:5px;vertical-align:-1px}
input.fld,select.fld{width:100%;background:var(--card2);border:1px solid var(--line2);border-radius:13px;padding:13px 15px;color:var(--text);font:400 13.5px var(--body);outline:none;margin-bottom:10px}
select.fld option{background:#141C3E}
.seg{display:flex;background:var(--card);border:1px solid var(--line2);border-radius:13px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:none;background:none;color:var(--muted);font:600 12px var(--body);padding:9px;border-radius:10px;cursor:pointer}
.seg button.on{background:rgba(255,210,122,.14);color:var(--light1)}
.focus-visible :focus-visible,button:focus-visible,.tab:focus-visible{outline:2px solid var(--light1);outline-offset:2px}
</style>
</head>
<body>
<div id="phone">
  <div class="sandbox-tag">بيانات تجريبية · SANDBOX</div>
  <header id="appbar" hidden></header>
  <main id="screen-root"></main>
  <nav id="tabbar" hidden></nav>
  <button id="demo-fab" hidden>▶ وضع العرض</button>
  <div id="demo-overlay"></div>
  <div id="sheet-root"></div>
  <div id="toast"></div>
</div>
<script>
'use strict';
/* =====================================================================
   نيّر — NAIR · MVP architecture
   Layers: DemoDataGenerator → MockAlinmaOpenBankingAPI → OpenBankingAdapter
           TransactionClassifier → ObligationDetector → CashflowForecaster
           HealthScoreEngine → ScenarioSimulator → AgentDecisionEngine
           PermissionManager → ActivityLogger → Views/Router → DemoMode
   ===================================================================== */
const SAR='ر.س';
const DAY=864e5;
const AR_M=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const addD=(d,n)=>new Date(d.getTime()+n*DAY);
const dstr=d=>`${d.getDate()} ${AR_M[d.getMonth()]}`;
const daysTo=d=>Math.round((d-TODAY)/DAY);
const fmt=(n,dec)=>{const v=Math.abs(n);const s=v.toLocaleString('en-US',{minimumFractionDigits:dec??0,maximumFractionDigits:dec??(v%1?2:0)});return (n<0?'−':'')+s};
const money=(n,dec)=>`<span class="num">${fmt(n,dec)}</span> ${SAR}`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ================= Demo dataset definitions (synthetic, labeled sandbox) ================= */
const SALARY={amount:14500,dom:27,src:'إيداع راتب — شركة نماء الوطنية'};
const PLAN_DEFS=[
 {id:'tamara1',provider:'تمارا',merchant:'تمارا Tamara',item:'iPhone 15 Pro — مكتبة جرير',total:4800,monthly:1200,count:4,dom:18,startMonthsAgo:2,type:'bnpl',clr:'#7C5CFF'},

/* ================= DemoDataGenerator ================= */
const DemoDataGenerator={
 occurrences(def){ // monthly occurrence dates for a plan
   const start=new Date(TODAY.getFullYear(),TODAY.getMonth()-def.startMonthsAgo,def.dom);
   const out=[];for(let k=0;k<def.count;k++)out.push(new Date(start.getFullYear(),start.getMonth()+k,def.dom));return out;
 },
 subOccurrences(def,fromD){ const out=[];let d=new Date(fromD.getFullYear(),fromD.getMonth(),def.dom);
   while(d<=addD(TODAY,40)){out.push(new Date(d));d=new Date(d.getFullYear(),d.getMonth()+1,def.dom);}return out;
 },
 generate(){
  const rng=mulberry32(7);const txs=[];let id=1;
  const from=addD(TODAY,-75);
  const push=(date,merchant,amount,hint)=>{if(date>TODAY||date<from)return;txs.push({id:'tx'+(id++),date,merchant,amount,hint})};
  // salary + savings
  let d=new Date(from.getFullYear(),from.getMonth(),SALARY.dom);
  while(d<=TODAY){push(d,SALARY.src,SALARY.amount,'salary');push(addD(d,1),'تحويل إلى حساب الادخار — الإنماء',-300,'savings');d=new Date(d.getFullYear(),d.getMonth()+1,SALARY.dom);}
  // plans
  PLAN_DEFS.forEach(p=>this.occurrences(p).forEach(o=>push(o,p.merchant+' — قسط',-p.monthly,p.type)));
  // subscriptions
  SUB_DEFS.forEach(s=>this.subOccurrences(s,from).forEach(o=>push(o,s.name+' — اشتراك',-s.amount,'subscription')));
  // dailies
  for(let i=0;i<=75;i++){const day=addD(from,i);if(day>TODAY)break;
    if(rng()<.68)push(day,MERCHANTS.coffee[Math.floor(rng()*4)],-(12+Math.round(rng()*16)),'coffee');
    if(rng()<.55)push(day,MERCHANTS.delivery[Math.floor(rng()*4)],-(34+Math.round(rng()*42)),'delivery');
    if(i%5===2)push(day,MERCHANTS.groceries[Math.floor(rng()*3)],-(90+Math.round(rng()*120)),'groceries');
    if(i%4===1)push(day,MERCHANTS.transport[Math.floor(rng()*4)],-(25+Math.round(rng()*90)),'transport');
    if(i%8===4)push(day,MERCHANTS.shopping[Math.floor(rng()*5)],-(70+Math.round(rng()*260)),'shopping');
    if(i%17===9)push(day,MERCHANTS.health[Math.floor(rng()*2)],-(30+Math.round(rng()*90)),'health');
  }
  push(addD(TODAY,-19),'مستشفى دلة — طوارئ',-480,'health');
  txs.sort((a,b)=>b.date-a.date);
  return txs;
 }
};

/* ================= TransactionClassifier ================= */
const TransactionClassifier={
 classify(tx){
  const m=tx.merchant;
  const has=k=>m.includes(k);
  let category='other',flags={},reason='';
  if(tx.amount>0&&has('راتب')){category='salary';flags.salary=true;reason='إيداع كبير متكرر شهريًا بنفس المبلغ يوم '+SALARY.dom+' — نمط راتب';}
  else if(has('تمارا')||has('تابي')||has('مدفوع Madfu')){category='bnpl';flags.bnpl=true;reason='تاجر دفعات آجلة معروف + دفعات متساوية بإيقاع شهري — خطة BNPL';}
  else if(has('قسط تمويل')){category='installment';flags.installment=true;reason='وصف "قسط تمويل" + مبلغ ثابت شهريًا — قسط بنكي (مرابحة)';}
  else if(has('اشتراك')){category='subscription';flags.subscription=true;reason='نفس التاجر ونفس المبلغ كل ~30 يوم — اشتراك متكرر';}
  else if(has('الادخار')){category='savings';flags.savings=true;reason='تحويل دوري لحساب الادخار';}
  else if(MERCHANTS.delivery.some(has)){category='delivery';reason='تطبيق توصيل طعام معروف';}
  else if(MERCHANTS.coffee.some(has)){category='coffee';reason='سلسلة قهوة معروفة';}
  else if(MERCHANTS.groceries.some(has)){category='groceries';reason='سوبرماركت معروف';}
  else if(MERCHANTS.transport.some(has)){category='transport';reason='مواصلات أو محطة وقود';}
  else if(MERCHANTS.shopping.some(has)){category='shopping';reason='متجر تسوق معروف';}
  else if(MERCHANTS.health.some(has)||has('مستشفى')){category='health';reason='منشأة صحية/صيدلية';}
  return {...tx,category,flags,classifierReason:reason||'تصنيف افتراضي'};
 },
 run(txs){return txs.map(t=>this.classify(t))}
};

/* ================= ObligationDetector ================= */
const ObligationDetector={
 detect(txs){
  const plans=PLAN_DEFS.map(p=>{
    const occ=DemoDataGenerator.occurrences(p);
    const paid=occ.filter(o=>o<=TODAY).length;
    const next=occ.find(o=>o>TODAY)||null;
    const paidAmt=paid*p.monthly, remaining=p.total-paidAmt;
    return {...p,occ,paidCount:paid,paidAmt,remaining,nextDue:next,
      estimated:p.type==='bnpl',
      detectionReason:p.type==='bnpl'
        ?`رصدنا ${paid} دفعة متساوية (${fmt(p.monthly)} ${SAR}) لتاجر ${p.provider} بإيقاع شهري يوم ${p.dom} — الإجمالي تقدير من نمط «ادفع على 4».`
        :`خصم ثابت ${fmt(p.monthly)} ${SAR} شهريًا بوصف "قسط تمويل" من مصرف الإنماء يوم ${p.dom}.`};
  });
  const subs=SUB_DEFS.map(s=>{
    const occ=DemoDataGenerator.subOccurrences(s,addD(TODAY,-75));
    const next=occ.find(o=>o>TODAY);
    return {...s,nextDue:next,type:'subscription',
      detectionReason:`نفس المبلغ (${fmt(s.amount,2)} ${SAR}) من «${s.name}» كل ~30 يوم — اشتراك متكرر.`};
  });
  return {plans,subs};
 }
};

/* ================= CashflowForecaster ================= */
const CashflowForecaster={
 avgDaily(txs){
  const from=addD(TODAY,-30);
  const disc=txs.filter(t=>t.date>=from&&t.amount<0&&!t.flags.bnpl&&!t.flags.installment&&!t.flags.subscription&&!t.flags.savings);
  const total=disc.reduce((s,t)=>s-t.amount,0);
  return Math.round(total/30);
 },
 dailyStats(txs){
  const from=addD(TODAY,-30);const byDay={};
  txs.filter(t=>t.date>=from&&t.amount<0&&!t.flags.bnpl&&!t.flags.installment&&!t.flags.savings).forEach(t=>{const k=t.date.toDateString();byDay[k]=(byDay[k]||0)-t.amount});
  const vals=Object.values(byDay);const mean=vals.reduce((a,b)=>a+b,0)/(vals.length||1);
  const sd=Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/(vals.length||1));
  return {mean,sd,cv:mean?sd/mean:0};
 },
 project(state,opts={}){
  const {plans,subs}=state.obligations;
  const buffer=500;
  let bal=state.balance;
  if(opts.reserve)bal-=opts.reserve;             // funds moved to protected pocket
  const daily=opts.dailyCap?Math.min(state.avgDaily,opts.dailyCap):state.avgDaily;
  const pts=[];const horizon=30;
  for(let i=1;i<=horizon;i++){
    const d=addD(TODAY,i);const events=[];
    if(d.getDate()===SALARY.dom){bal+=SALARY.amount;events.push({t:'راتب',amt:SALARY.amount});}
    plans.forEach(p=>{const due=p.occ.find(o=>o.getTime()===d.getTime());
      if(due){ if(opts.reserve&&p.type==='bnpl'&&daysTo(due)<=daysToSalary()){events.push({t:p.provider+' (من المحفظة المحمية)',amt:0});}
        else {bal-=p.monthly;events.push({t:'قسط '+p.provider,amt:-p.monthly});}}});
    subs.forEach(s=>{if(s.nextDue&&s.nextDue.getTime()===d.getTime()){bal-=s.amount;events.push({t:'اشتراك '+s.name,amt:-s.amount});}
      else{const o2=new Date(s.nextDue.getFullYear(),s.nextDue.getMonth()+1,s.dom);if(o2.getTime()===d.getTime()){bal-=s.amount;events.push({t:'اشتراك '+s.name,amt:-s.amount});}}});
    if(d.getDate()===SALARY.dom+1){bal-=300;events.push({t:'تحويل ادخار',amt:-300});}
    if(opts.extra&&opts.extra.dates.some(x=>x.getTime()===d.getTime())){bal-=opts.extra.amount;events.push({t:opts.extra.label,amt:-opts.extra.amount});}
    bal-=daily;
    pts.push({date:d,balance:Math.round(bal),events,danger:bal<buffer});
  }
  const dangerDays=pts.filter(p=>p.danger&&p.date<nextSalaryDate());
  const minPt=pts.slice(0,daysToSalary()).reduce((m,p)=>p.balance<m.balance?p:m,pts[0]);
  return {pts,dangerDays,minPt,buffer,daily};
 }
};
function nextSalaryDate(){let d=new Date(TODAY.getFullYear(),TODAY.getMonth(),SALARY.dom);if(d<=TODAY)d=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,SALARY.dom);return d}
function daysToSalary(){return daysTo(nextSalaryDate())}

/* ================= HealthScoreEngine ================= */
const HealthScoreEngine={
 compute(state,overrides={}){
  const {plans,subs}=state.obligations;
  const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
  const income=SALARY.amount;
  const planMonthly=plans.reduce((s,p)=>s+(p.nextDue?p.monthly:0),0)+(overrides.extraMonthly||0);
  const subMonthly=subs.reduce((s,x)=>s+x.amount,0);
  const oblig=planMonthly+subMonthly;
  const ratio=oblig/income*100;
  const bnplPlans=plans.filter(p=>p.type==='bnpl'&&p.nextDue).length+(overrides.extraBnplPlan?1:0);
  const bnplShare=(plans.filter(p=>p.type==='bnpl'&&p.nextDue).reduce((s,p)=>s+p.monthly,0)+(overrides.extraMonthly||0))/income*100;
  const monthlyOutflow=oblig+state.avgDaily*30;
  const bufferM=state.balance/monthlyOutflow;
  const savingsRate=300/income*100;
  const cv=state.dailyStats.cv;
  const dangerDays=overrides.dangerDays??state.forecast.dangerDays.length;
  const factors=[
   {key:'ratio',label:'نسبة الالتزامات للدخل',w:.25,score:clamp(100-(ratio-20)*1.8),detail:`${fmt(oblig)} ${SAR} من ${fmt(income)} ${SAR} = ${ratio.toFixed(0)}%`},
   {key:'bnpl',label:'انكشاف الدفعات الآجلة',w:.15,score:clamp(100-bnplPlans*10-bnplShare*1.2),detail:`${bnplPlans} خطط نشطة تستهلك ${bnplShare.toFixed(0)}% من الراتب`},
   {key:'risk',label:'مخاطر السيولة القادمة',w:.15,score:clamp(100-dangerDays*12),detail:dangerDays?`${dangerDays} يوم خطر متوقع قبل الراتب`:'لا أيام خطر متوقعة'},
   {key:'buffer',label:'احتياطي الطوارئ',w:.15,score:clamp(Math.sqrt(bufferM/1.5)*100),detail:`رصيدك يغطي ${(bufferM).toFixed(1)} شهر من مصاريفك (الهدف 1.5+)`},
   {key:'save',label:'معدل الادخار',w:.10,score:clamp(savingsRate/10*100+20),detail:`تدّخر ${savingsRate.toFixed(1)}% من راتبك شهريًا`},
   {key:'vol',label:'تقلب الصرف اليومي',w:.10,score:clamp(100-cv*55),detail:`تذبذب صرفك اليومي ${(cv*100).toFixed(0)}%`},
   {key:'subs',label:'حمل الاشتراكات',w:.10,score:clamp(100-(subMonthly/income*100)*6),detail:`${fmt(subMonthly)} ${SAR}/شهر (${(subMonthly/income*100).toFixed(1)}% من الراتب)`},
  ];
  const value=Math.round(factors.reduce((s,f)=>s+f.score*f.w,0));
  return {value,factors,ratio:Math.round(ratio),oblig,subMonthly,planMonthly,bnplPlans};
 }
};

/* ================= ScenarioSimulator ================= */
const ScenarioSimulator={
 run(state,dec){ // dec:{label, amount, months, upfront, startInDays, type}
  const monthly=Math.round(dec.amount/dec.months);
  const first=addD(TODAY,dec.startInDays??0);
  const dates=[];for(let k=dec.upfront?0:1;k<=dec.months;k++){const d=new Date(first.getFullYear(),first.getMonth()+ (dec.upfront?k:k-1),first.getDate());if(dec.upfront&&k===0)dates.push(first);else dates.push(d);}
  const before={score:state.score,forecast:state.forecast};
  const fAfter=CashflowForecaster.project(state,{extra:{amount:monthly,dates,label:dec.label}});
  const sAfter=HealthScoreEngine.compute(state,{extraMonthly:monthly,extraBnplPlan:dec.type==='bnpl',dangerDays:fAfter.dangerDays.length});
  const newDanger=fAfter.dangerDays.length-before.forecast.dangerDays.length;
  const weeklyCut=Math.max(0,Math.ceil((before.forecast.minPt.balance*-1+monthly+500)/4/10)*10);
  const altDelay=daysToSalary()+1;
  return {dec,monthly,before:{score:before.score.value,ratio:before.score.ratio,danger:before.forecast.dangerDays,min:before.forecast.minPt},
    after:{score:sAfter.value,ratio:sAfter.ratio,danger:fAfter.dangerDays,min:fAfter.minPt,forecast:fAfter},
    newDanger,weeklyCut:Math.max(weeklyCut,Math.ceil(monthly/4/10)*10),altDelay};
 }
};

/* ================= App state + pipeline ================= */
const App={
 connected:false,tab:'home',state:{},_orb:'idle',
 orb(s){this._orb=s;document.querySelectorAll('.orb[data-live]').forEach(o=>o.dataset.state=s)},
 async runPipeline(){
  const accounts=await OpenBankingAdapter.accounts();
  const bal=(await OpenBankingAdapter.balances())[0];
  const raw=await OpenBankingAdapter.transactions();
  const txs=TransactionClassifier.run(raw);
  const obligations=ObligationDetector.detect(txs);
  this.state={accounts,balance:bal.amount,txs,obligations};
  this.recompute();
  this.connected=true;
 },
 recompute(){
  const s=this.state;
  s.avgDaily=CashflowForecaster.avgDaily(s.txs);
  s.dailyStats=CashflowForecaster.dailyStats(s.txs);
  s.forecast=CashflowForecaster.project(s,{reserve:s.reserve||0,dailyCap:s.dailyCap});
  s.score=HealthScoreEngine.compute(s);
 },
};

const riskTag=lvl=>lvl==='مرتفع'?'<span class="tag r">مرتفع</span>':lvl==='متوسط'?'<span class="tag w">متوسط</span>':'<span class="tag s">منخفض</span>';

/* ================= score ring svg ================= */
function ringSVG(val){
  const r=72,c=2*Math.PI*r,off=c*(1-val/100);
  const col=val>=70?'var(--safe)':val>=50?'var(--light1)':'var(--risk)';
  return `<div class="ringwrap"><svg width="168" height="168" viewBox="0 0 168 168">
    <circle cx="84" cy="84" r="${r}" stroke="rgba(255,255,255,.08)" stroke-width="11" fill="none"/>
    <circle cx="84" cy="84" r="${r}" stroke="${col}" stroke-width="11" fill="none" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 0 8px ${col})"/>
  </svg><div class="mid"><b style="color:${col}">${val}</b><span>درجة الصحة المالية</span></div></div>`;
}
/* ================= forecast chart svg ================= */
function forecastSVG(fc,h=150){
  const pts=[{date:TODAY,balance:App.state.balance-(App.state.reserve||0),danger:false},...fc.pts];
  const W=360,H=h,pad=8;
  const min=Math.min(0,...pts.map(p=>p.balance)),max=Math.max(...pts.map(p=>p.balance),App.state.balance);
  const X=i=>pad+i*(W-2*pad)/(pts.length-1);
  const Y=v=>H-pad-(v-min)/(max-min||1)*(H-2*pad);
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.balance).toFixed(1)}`).join(' ');
  const area=line+` L${X(pts.length-1).toFixed(1)} ${H-pad} L${pad} ${H-pad} Z`;
  const zeroY=Y(fc.buffer);
  let danger='';pts.forEach((p,i)=>{if(p.danger){danger+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.balance).toFixed(1)}" r="4" fill="var(--risk)" stroke="#0B1024" stroke-width="1.5"/>`;}});
  // salary marker
  let sal='';pts.forEach((p,i)=>{if(p.date.getDate()===SALARY.dom&&p.events&&p.events.some(e=>e.amt>0)){sal=`<line x1="${X(i).toFixed(1)}" y1="${pad}" x2="${X(i).toFixed(1)}" y2="${H-pad}" stroke="var(--safe)" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/><text x="${X(i).toFixed(1)}" y="${pad+10}" fill="var(--safe)" font-size="9" text-anchor="middle">راتب</text>`;}});
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block">
    <defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--light1)" stop-opacity=".28"/><stop offset="1" stop-color="var(--light1)" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pad}" y1="${zeroY.toFixed(1)}" x2="${W-pad}" y2="${zeroY.toFixed(1)}" stroke="var(--risk)" stroke-width="1" stroke-dasharray="4 4" opacity=".5"/>
    <text x="${W-pad}" y="${(zeroY-4).toFixed(1)}" fill="var(--risk)" font-size="9" text-anchor="end" opacity=".8">حد الأمان ${fc.buffer}</text>
    ${sal}<path d="${area}" fill="url(#fg)"/><path d="${line}" fill="none" stroke="var(--light1)" stroke-width="2" stroke-linejoin="round"/>${danger}
  </svg>`;
}

 protectFromForecast(){const prop=AgentDecisionEngine.nextRiskProposal();if(prop)AgentDecisionEngine.execute(prop);},

 // ---------- SPENDING ANALYSIS ----------
 spending(){
  const from=addD(TODAY,-30);
  const byCat={};App.state.txs.filter(t=>t.date>=from&&t.amount<0).forEach(t=>{byCat[t.category]=(byCat[t.category]||0)-t.amount});
  const arr=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const total=arr.reduce((a,b)=>a+b[1],0);
  const top=arr[0];
  return `<h2 class="vt">تحليل الصرف</h2><p class="vs">إلى أين تذهب فلوسك؟ آخر 30 يوم.</p>
   <div class="card glow"><div class="row"><div class="grow"><div style="font-size:12px;color:var(--muted)">إجمالي الصرف</div><b style="font:800 26px var(--disp)">${fmt(total)} <small style="font-size:13px">${SAR}</small></b></div>${orbEl(44,false)}</div></div>
   <div class="card risk" style="display:flex;gap:10px;align-items:center"><div style="font-size:22px">🔍</div><div><b style="font:600 13px var(--disp)">أكثر شيء يسحب فلوسك</b><div style="font-size:12px;color:var(--muted);margin-top:4px">${CAT_AR[top[0]]} — ${fmt(top[1])} ${SAR} (${Math.round(top[1]/total*100)}% من صرفك)</div></div></div>
   <div class="section-t"><b>حسب الفئة</b></div>
   <div class="card">${arr.map(([c,v])=>`<div style="margin-bottom:13px"><div class="row"><div class="licon" style="width:30px;height:30px;border-radius:9px;background:${catColor(c)}22;color:${catColor(c)}">${''}</div><b style="flex:1;font:500 13px var(--body)">${CAT_AR[c]}</b><b class="num">${fmt(v)} ${SAR}</b></div><div class="bar" style="margin-top:7px"><i style="width:${Math.round(v/arr[0][1]*100)}%;background:${catColor(c)}"></i></div></div>`).join('')}</div>`;
 },

 // ---------- AGENT CHAT ----------
 agent(){
  if(!this._chat){this._chat=[{role:'agent',html:`أنا <b>نيّر</b> — وكيلك المالي. أرى التزاماتك وتوقّع رصيدك. اسألني أو اختر أمرًا:`}];}
  return `<div class="row" style="margin:10px 0 6px;gap:10px">${orbEl(40,true)}<div><b style="font:600 16px var(--disp)">نيّر</b><div style="font-size:11px;color:var(--safe)">● متصل بحسابك عبر Open Banking</div></div></div>
   <div class="chatwrap" id="chatwrap">${this._chat.map(m=>`<div class="msg ${m.role}">${m.html}</div>`).join('')}</div>
   <div class="chips">${['أقدر أشتري جوال بتابي؟','ليش درجتي نزلت؟','وش أكثر شيء يسحب فلوسي؟','احمِ أقساطي هذا الشهر','وفّر لي ٥٠٠٠ للسفر'].map(c=>`<button class="chip" onclick="Views.ask('${c}')">${c}</button>`).join('')}</div>
   <div id="chatbar"><input id="chatin" placeholder="اكتب أمرك لنيّر…" onkeydown="if(event.key==='Enter')Views.ask(this.value)"><button class="send" onclick="var i=document.getElementById('chatin');Views.ask(i.value)">↑</button></div>`;
 },
 ask(text){
  text=(text||'').trim();if(!text)return;
  this._chat.push({role:'user',html:esc(text)});
  this._chat.push({role:'agent',html:'<div class="typing"><i></i><i></i><i></i></div>'});
  this.render();this.scrollChat();
  setTimeout(()=>{this._chat.pop();this._chat.push({role:'agent',html:this.agentReply(text)});this.render();this.scrollChat();},850);
 },
 agentReply(t){
  const s=App.state,sc=s.score;
  const kv=rows=>`<div style="margin-top:8px">${rows.map(([k,v])=>`<div class="mini-kv"><span>${k}</span><b>${v}</b></div>`).join('')}</div>`;
  if(/تابي|تمارا|أشتري|اشتري|جوال|أقدر/.test(t)){
   const sim=AgentDecisionEngine.affordability(3200,4,'bnpl','جوال عبر تابي');
   App.orb('alert');setTimeout(()=>App.orb('idle'),2500);
   return `حسبتها لك على بيانات حسابك 👇 شراء بـ <b>3,200 ${SAR}</b> على 4 دفعات (800 ${SAR}/شهر):
    ${kv([['التزام شهري إضافي','+'+fmt(sim.monthly)+' '+SAR],['درجتك','من '+sim.before.score+' ← <b style="color:var(--risk)">'+sim.after.score+'</b>'],['نسبة الالتزامات','من '+sim.before.ratio+'% ← '+sim.after.ratio+'%'],['أيام خطر جديدة','<b style="color:var(--risk)">+'+Math.max(0,sim.newDanger)+'</b>'+(sim.after.danger.length?' (أقربها '+dstr(sim.after.danger[0].date)+')':'')]])}
    <p style="margin-top:10px;line-height:1.9">رأيي: العملية ممكنة لكنها ترفع الضغط قبل الراتب. <b style="color:var(--safe)">الأأمن:</b> أجّلها ${sim.altDelay} يوم لما يجي الراتب، أو خفّض صرفك الأسبوعي ${fmt(sim.weeklyCut)} ${SAR}.</p>
    <div class="btnrow"><button class="btn sm" onclick="go('simulator')">افتح المحاكي</button></div>`;
  }
  if(/درجت|نزل|score|صحة/.test(t)){
   const worst=[...sc.factors].sort((a,b)=>a.score-b.score)[0];
   return `درجتك الآن <b>${sc.value}/100</b>. أكثر عامل يسحبها: <b>${worst.label}</b> (${worst.score}/100) — ${worst.detail}. نسبة التزاماتك ${sc.ratio}% من الراتب. <button class="why" onclick="Views.scoreWhy()" style="margin-top:8px">شوف التفصيل الكامل</button>`;
  }
  if(/يسحب|أكثر|صرف|فلوس/.test(t)){
   const from=addD(TODAY,-30);const byCat={};s.txs.filter(x=>x.date>=from&&x.amount<0).forEach(x=>byCat[x.category]=(byCat[x.category]||0)-x.amount);
   const arr=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,3);
   return `أكثر ثلاث فئات تسحب فلوسك (آخر 30 يوم):${kv(arr.map(([c,v])=>[CAT_AR[c],fmt(v)+' '+SAR]))}<button class="btn ghost sm" style="margin-top:10px" onclick="go('spending')">تحليل كامل</button>`;
  }
  if(/احمِ|احم|أقساط|حماية/.test(t)){
   const prop=AgentDecisionEngine.nextRiskProposal();
   if(!prop)return 'أقساطك مغطّاة ولا أرى أيام خطر حاليًا — ما تحتاج حماية الآن. 👍';
   App.orb('alert');setTimeout(()=>App.orb('idle'),2000);
   return `تمام. أقترح حجز <b>${fmt(prop.amount)} ${SAR}</b> لأقساط تمارا وتابي القادمة في محفظة محمية، ضمن صلاحية حماية الأقساط (حد ${fmt(PermissionManager.get('protect').max)} ${SAR}). محتاج موافقتك:
    ${this.proposalCard(prop)}`;
  }
  if(/وفّر|وفر|ادخر|سفر|٥٠٠٠|5000|هدف/.test(t)){
   const weeks=10,wk=Math.ceil(5000/weeks/10)*10;
   return `هدف <b>5,000 ${SAR}</b> للسفر. على وضعك الحالي أنصح بخطة آمنة لا تلمس أقساطك:${kv([['المبلغ الأسبوعي الآمن',fmt(wk)+' '+SAR],['المدة','~'+weeks+' أسابيع'],['الأثر على أيام الخطر','بدون أثر — يُسحب بعد الراتب']])}<p style="margin-top:8px">أقدر أفعّل الادخار التلقائي ضمن حد ${fmt(PermissionManager.get('autosave').max)} ${SAR}/أسبوع — بموافقتك.</p><div class="btnrow"><button class="btn sm" onclick="go('goals')">أنشئ الهدف</button></div>`;
  }
  if(/نادي|اشترك|اشتراك/.test(t)){
   return `قبل ما تشترك بأي شيء جديد: التزاماتك الحالية ${sc.ratio}% من الراتب ${sc.ratio>30?'<b style="color:var(--warn)">(فوق الموصى به)</b>':''}. إضافة اشتراك شهري سيزيد الحمل. لو ضروري، أقترح مراجعة اشتراك غير مستخدم أولًا لتعويض التكلفة.`;
  }
  return `فهمت إنك تسأل عن وضعك المالي. أقدر أساعدك في: فحص قدرتك على الشراء، شرح درجتك، تحليل صرفك، حماية أقساطك، أو خطة ادخار. جرّب أحد الأزرار فوق 👆`;
 },
 scrollChat(){setTimeout(()=>{const w=document.getElementById('chatwrap');if(w)w.parentElement.scrollTop=w.parentElement.scrollHeight;},60);},

 // ---------- DECISION SIMULATOR ----------
 simulator(){
  if(!this._sim)this._sim={preset:'phone'};
  const presets={
    phone:{label:'جوال عبر تابي',amount:3200,months:4,type:'bnpl'},
    travel:{label:'رحلة سفر',amount:4500,months:1,type:'cash',upfront:true},
    sub:{label:'اشتراك جديد سنوي',amount:1200,months:12,type:'subscription'},
    car:{label:'قسط شهري جديد',amount:9000,months:6,type:'installment'},
  };
  return `<h2 class="vt">اختبر قرارك</h2><p class="vs">شوف أثر أي قرار على رصيدك ودرجتك قبل ما تاخذه.</p>
   <div class="seg">${Object.entries({phone:'جوال (تابي)',travel:'سفر',sub:'اشتراك',car:'قسط'}).map(([k,v])=>`<button class="${this._sim.preset===k?'on':''}" onclick="Views._sim.preset='${k}';Views._sim.custom=null;Views.render()">${v}</button>`).join('')}</div>
   <div class="card"><div style="font-size:12px;color:var(--muted);margin-bottom:8px">أو أدخل قرارك:</div>
     <input class="fld" id="simAmt" type="number" placeholder="المبلغ ${SAR}" value="${this._sim.custom?this._sim.custom.amount:presets[this._sim.preset].amount}">
     <select class="fld" id="simMonths"><option value="1">دفعة واحدة</option><option value="3">3 دفعات</option><option value="4" selected>4 دفعات (BNPL)</option><option value="6">6 أشهر</option><option value="12">12 شهر</option></select>
     <button class="btn" onclick="Views.runSim()">شغّل المحاكاة</button>
   </div>
   <div id="simResult"></div>`;
 },
 runSim(){
  const amount=+document.getElementById('simAmt').value||3200;
  const months=+document.getElementById('simMonths').value||4;
  const type=months>=12?'subscription':months===1?'cash':months>=6?'installment':'bnpl';
  const sim=ScenarioSimulator.run(App.state,{label:'قرارك',amount,months,type,upfront:months===1,startInDays:1});
  const drop=sim.before.score-sim.after.score;
  const el=document.getElementById('simResult');
  const cmp=(label,b,a,worse)=>`<div class="kv"><span>${label}</span><b>${b} <span style="color:var(--faint)">←</span> <span style="color:${worse?'var(--risk)':'var(--safe)'}">${a}</span></b></div>`;
  el.innerHTML=`<div class="card risk" style="margin-top:14px">
    <div class="row" style="margin-bottom:8px">${orbEl(34,false)}<b style="flex:1;font:600 14px var(--disp)">تحليل نيّر</b><span class="tag ${drop>6?'r':'w'}">${drop>0?'−'+drop:'+'+(-drop)} نقطة</span></div>
    ${cmp('درجة الصحة المالية',sim.before.score,sim.after.score,drop>0)}
    ${cmp('نسبة الالتزامات',sim.before.ratio+'%',sim.after.ratio+'%',sim.after.ratio>sim.before.ratio)}
    ${cmp('أيام الخطر قبل الراتب',sim.before.danger.length,sim.after.danger.length,sim.after.danger.length>sim.before.danger.length)}
    <div class="kv"><span>التزام شهري إضافي</span><b style="color:var(--light1)">+${fmt(sim.monthly)} ${SAR}</b></div>
  </div>
  <div class="card" style="background:var(--card2)"><b style="font:600 13px var(--disp);color:var(--light1)">⚠️ شرح المخاطر</b>
    <p style="font-size:12.5px;color:var(--muted);line-height:1.9;margin-top:8px">${sim.after.danger.length>sim.before.danger.length?`يظهر يوم خطر جديد حول <b style="color:var(--risk)">${dstr(sim.after.danger[sim.after.danger.length-1].date)}</b> لأن الدفعة الإضافية تخفض رصيدك تحت حد الأمان قبل الراتب.`:'لا يضيف هذا القرار أيام خطر جديدة، لكنه يرفع نسبة التزاماتك ويقلّل مرونتك.'}</p></div>
  <div class="card safe"><b style="font:600 13px var(--disp)">✅ البديل الأأمن</b>
    <p style="font-size:12.5px;color:var(--muted);line-height:1.9;margin-top:8px">أجّل القرار <b style="color:var(--safe)">${sim.altDelay} يوم</b> حتى راتب ${dstr(nextSalaryDate())} — تختفي المخاطر تمامًا. أو وزّع التكلفة بخفض صرفك الأسبوعي <b>${fmt(sim.weeklyCut)} ${SAR}</b>.</p></div>`;
  this.scrollTo(el);
 },
 scrollTo(el){setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'nearest'}),80);},

 // ---------- GOALS ----------
 goals(){
  if(!this._goals)this._goals=[{id:'g1',name:'صندوق طوارئ',target:10000,saved:2400,weekly:200,clr:'var(--safe)'},{id:'g2',name:'رحلة سفر',target:5000,saved:800,weekly:300,clr:'var(--light1)'}];
  return `<h2 class="vt">أهدافي</h2><p class="vs">أهداف ادخار يحرسها نيّر — بمبالغ أسبوعية آمنة لا تمسّ أقساطك.</p>
   ${this._goals.map(g=>{const pct=Math.round(g.saved/g.target*100),wks=Math.ceil((g.target-g.saved)/g.weekly);return `
   <div class="card" onclick="Views.goalDetail('${g.id}')" style="cursor:pointer"><div class="row"><div class="grow"><b style="font:600 15px var(--disp)">${g.name}</b><div style="font-size:11.5px;color:var(--muted);margin-top:4px">${fmt(g.saved)} من ${fmt(g.target)} ${SAR}</div></div><b class="num" style="color:${g.clr}">${pct}%</b></div>
     <div class="bar" style="height:9px;margin-top:10px"><i class="${g.clr==='var(--safe)'?'s':''}" style="width:${pct}%;background:${g.clr}"></i></div>
     <div style="font-size:11px;color:var(--faint);margin-top:8px">${fmt(g.weekly)} ${SAR}/أسبوع · يكتمل خلال ~${wks} أسبوع</div></div>`}).join('')}
   <button class="btn ghost" onclick="Views.newGoal()">+ هدف جديد</button>`;
 },
 goalDetail(id){const g=this._goals.find(x=>x.id===id);const pct=Math.round(g.saved/g.target*100);
  openSheet(`<b style="font:700 17px var(--disp)">${g.name}</b><div class="ringwrap" style="width:130px;height:130px;margin:14px auto"><svg width="130" height="130" viewBox="0 0 168 168" style="transform:rotate(-90deg)"><circle cx="84" cy="84" r="72" stroke="rgba(255,255,255,.08)" stroke-width="13" fill="none"/><circle cx="84" cy="84" r="72" stroke="${g.clr}" stroke-width="13" fill="none" stroke-linecap="round" stroke-dasharray="${2*Math.PI*72}" stroke-dashoffset="${2*Math.PI*72*(1-pct/100)}"/></svg><div class="mid"><b style="font-size:30px;color:${g.clr}">${pct}%</b></div></div>
   <div class="card" style="margin:0"><div class="kv"><span>المُدّخر</span><b>${fmt(g.saved)} ${SAR}</b></div><div class="kv"><span>الهدف</span><b>${fmt(g.target)} ${SAR}</b></div><div class="kv"><span>المتبقي</span><b>${fmt(g.target-g.saved)} ${SAR}</b></div><div class="kv"><span>الادخار الأسبوعي</span><b>${fmt(g.weekly)} ${SAR}</b></div></div>
   <p style="font-size:12px;color:var(--muted);line-height:1.9;margin:12px 2px">نيّر اختار ${fmt(g.weekly)} ${SAR}/أسبوع لأنه آمن على تدفقك ولا يخلق أيام خطر. يُسحب بعد الراتب فقط.</p>
   <button class="btn safe" onclick="closeSheet();toast('💰 أضيف 200 ر.س للهدف');Views._goals.find(x=>x.id==='${id}').saved+=200;Views.render()">أضف ادخار هذا الأسبوع</button>`);},
 newGoal(){openSheet(`<b style="font:700 16px var(--disp)">هدف جديد</b><input class="fld" id="gn" placeholder="اسم الهدف" style="margin-top:12px"><input class="fld" id="gt" type="number" placeholder="المبلغ المستهدف ${SAR}"><button class="btn" onclick="(function(){var n=document.getElementById('gn').value||'هدف',t=+document.getElementById('gt').value||3000;Views._goals.push({id:'g'+Date.now(),name:n,target:t,saved:0,weekly:Math.ceil(t/16/10)*10,clr:'var(--light1)'});closeSheet();ActivityLogger.log('action','أنشأت هدف ادخار',n+' — '+t+' ر.س','user');Views.render();})()">إنشاء — نيّر يحسب المبلغ الأسبوعي الآمن</button>`);},

 permissions(){

     <div class="stat" style="text-align:center"><span>من راتبك</span><b style="color:${sc.ratio>30?'var(--risk)':'var(--text)'}">${sc.ratio}%</b></div>
   </div>
   <div class="card glow" style="text-align:center;margin-top:12px"><div style="font-size:12px;color:var(--muted)">كنت تظن التزاماتك أقل؟</div><b style="font:800 22px var(--disp);display:block;margin-top:6px">٤ خطط دفع + ٦ اشتراكات</b><div style="font-size:12px;color:var(--muted);margin-top:6px">≈ ثلث راتبك، موزّعة عبر تطبيقات لا تتحدث مع بعضها.</div></div>
   <button class="btn" style="margin-top:16px" onclick="enterApp('home')">شوف لوحتك الكاملة</button>
 </div>`);
 App.orb('idle');
}

/* ================= Demo Mode (guided 12-step overlay for judges) ================= */
const DemoMode={
 active:false,step:0,
 steps:[
  {t:'المشكلة حقيقية',d:'عبدالله، 27، موظف بالرياض، يظن وضعه مرتاح. لكن التزاماته موزّعة عبر تمارا وتابي ومدفوع والبنك والاشتراكات — لا يراها مجتمعة.',go:()=>splash()},
  {t:'الربط بمصرف الإنماء',d:'كل شيء يبدأ من Open Banking. الإنماء هو البنك الأساسي. اضغط "التالي" ليربط نيّر الحساب.',go:()=>startConnect()},
  {t:'موافقة شفّافة',d:'نيّر يطلب قراءة الحسابات والأرصدة والعمليات فقط — لمدة 90 يوم. لا يقدر يحرّك أي ريال بهذه الموافقة.',go:()=>consentScreen()},
  {t:'المسح الذكي',d:'يقرأ نيّر 243 عملية، يصنّفها، ويكتشف الالتزامات تلقائيًا أمام عينيك.',go:()=>authoriseAndScan()},
  {t:'الالتزامات المخفية تظهر',d:'٤ خطط دفع + ٦ اشتراكات ≈ ثلث الراتب — في مكان واحد لأول مرة.',go:()=>enterApp('obligations')},
  {t:'درجة الصحة المالية',d:'درجة 0–100 قابلة للشرح — كل عامل ووزنه وسببه واضح.',go:()=>{enterApp('home');setTimeout(()=>Views.scoreWhy(),400)}},
  {t:'يوم الخطر القادم',d:'يتوقع نيّر الرصيد 30 يوم ويكشف أيام نقص السيولة قبل الراتب — مع السبب.',go:()=>{closeSheet();enterApp('forecast')}},
  {t:'اسأل نيّر: أقدر أشتري جوال بتابي؟',d:'الوكيل يحوّل سؤالك إلى تحليل على بياناتك الحقيقية.',go:()=>{enterApp('agent');setTimeout(()=>Views.ask('أقدر أشتري جوال بتابي؟'),500)}},
  {t:'المحاكاة: الدرجة تنزل والخطر يظهر',d:'الشراء يرفع الالتزام 800 ر.س، تنزل الدرجة، ويظهر يوم خطر جديد.',go:()=>{enterApp('simulator');setTimeout(()=>Views.runSim(),500)}},
  {t:'بديل أأمن',d:'نيّر لا يكتفي بالتحذير — يقترح تأجيل الشراء أو خفض الصرف الأسبوعي.',go:()=>{enterApp('simulator');setTimeout(()=>Views.runSim(),300)}},
  {t:'وافق على حماية الأقساط',d:'بموافقتك، يحجز نيّر مبالغ الأقساط ويقترح سقف صرف — فتختفي أيام الخطر.',go:()=>{const p=AgentDecisionEngine.nextRiskProposal();if(p&&!App.state.reserve)AgentDecisionEngine.execute(p);enterApp('home')}},
  {t:'سجل النشاط + خلاصة القيمة',d:'كل خطوة مسجّلة بشفافية. نيّر ما يراقب فلوسك — يحميها، بإذنك.',go:()=>enterApp('log')},
 ],
 start(){this.active=true;this.step=0;this.show();},
 show(){
  const s=this.steps[this.step];
  document.getElementById('demo-overlay').classList.add('open');
  document.getElementById('demo-overlay').innerHTML=`<div class="panel">
    <div class="row" style="margin-bottom:4px"><div class="steps" style="flex:1">خطوة ${this.step+1} من ${this.steps.length} · وضع العرض</div><button onclick="DemoMode.stop()" style="background:none;border:none;color:var(--faint);font-size:18px;cursor:pointer">✕</button></div>
    <h4>${s.t}</h4><p>${s.d}</p>
    <div style="display:flex;gap:3px;margin:12px 0">${this.steps.map((_,k)=>`<div style="flex:1;height:3px;border-radius:99px;background:${k<=this.step?'var(--light1)':'rgba(255,255,255,.12)'}"></div>`).join('')}</div>
    <div class="btnrow" style="margin-top:4px">${this.step>0?`<button class="btn ghost sm" onclick="DemoMode.prev()">السابق</button>`:''}<button class="btn sm" onclick="DemoMode.next()">${this.step===this.steps.length-1?'إنهاء':'التالي ›'}</button></div>
  </div>`;
  try{s.go();}catch(e){}
  setTimeout(()=>document.getElementById('demo-overlay').classList.add('open'),10);
 },
 next(){if(this.step<this.steps.length-1){this.step++;this.show();}else this.stop();},
 prev(){if(this.step>0){this.step--;this.show();}},
 stop(){this.active=false;document.getElementById('demo-overlay').classList.remove('open');if(!App.connected){App.state.reserve=0;}if(App.connected)enterApp('home');toast('انتهى العرض التوضيحي');}
};

/* ================= Boot ================= */
document.getElementById('demo-fab').addEventListener('click',()=>DemoMode.start());
window.go=go;window.Views=Views;window.App=App;window.AgentDecisionEngine=AgentDecisionEngine;
window.PermissionManager=PermissionManager;window.ActivityLogger=ActivityLogger;window.DemoMode=DemoMode;
window.getProp=getProp;window.why=why;window.openSheet=openSheet;window.closeSheet=closeSheet;
window.startConnect=startConnect;window.consentScreen=consentScreen;window.authoriseAndScan=authoriseAndScan;
window.onboard=onboard;window.ScenarioSimulator=ScenarioSimulator;window.CashflowForecaster=CashflowForecaster;window.HealthScoreEngine=HealthScoreEngine;
splash();
</script>
</body>
